<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Brown Print — responsive walkthrough</title><style>*{box-sizing:border-box}body{margin:0;background:#e6ddd1;font:14px Arial;color:#35251e}header{height:92px;padding:18px 30px;display:flex;align-items:center;gap:16px;background:#35251e;color:#fff8ee}strong{font:26px Georgia}span{margin-right:auto}button{padding:11px 16px;border:1px solid #ac907a;color:#fff8ee;background:transparent;cursor:pointer}button[aria-pressed=true]{background:#fff8ee;color:#35251e}main{padding:18px;display:flex;justify-content:center}iframe{border:1px solid #c6b4a0;background:#f8f5ef;width:100%;height:770px;max-width:1180px}p{margin:0 30px 10px;color:#68564b;font-size:12px}</style></head><body><header><strong>The Brown Print</strong><span>RESPONSIVE WALKTHROUGH</span><button data-width="1180" aria-pressed="true">Desktop</button><button data-width="768" aria-pressed="false">Tablet</button><button data-width="390" aria-pressed="false">Phone</button><button id="signup">Signup</button></header><main><iframe title="The Brown Print responsive preview" src="index.html"></iframe></main><p>Portfolio demo · No details are stored or sent · Built with ChatGPT/Codex assistance</p><script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{frame.style.maxWidth=button.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)))}));document.querySelector('#signup').addEventListener('click',()=>frame.contentDocument.querySelector('#join').scrollIntoView({behavior:'instant'}));</script></body></html>
